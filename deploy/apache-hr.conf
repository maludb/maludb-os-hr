# HR — an application from us beside the Business OS kernel (mcp-and-api.md §7).
# Two virtual hosts: the public name for people (and the two proxied MCP servers), and a loopback
# port for the kernel's actions server and approval replays. Copy to
# /etc/apache2/sites-available/hr.conf, `a2ensite hr`, `systemctl reload apache2`.
# The ports come from config/.env: APP_INTERNAL_PORT 8180, MCP_RECORDS_PORT 8821, MCP_ACTIVITY_PORT 8822.

<VirtualHost *:80>
	ServerName hr.subello.com
	DocumentRoot /srv/apps/hr/html
	ErrorLog ${APACHE_LOG_DIR}/hr-error.log
	CustomLog ${APACHE_LOG_DIR}/hr-access.log combined
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on

	<Directory /srv/apps/hr/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# The two read MCP servers, under the application's name. Host is NOT preserved (the SDK's
	# DNS-rebinding guard checks it against loopback).
	ProxyPreserveHost Off
	ProxyPass        /mcp/records  http://127.0.0.1:8821/mcp
	ProxyPassReverse /mcp/records  http://127.0.0.1:8821/mcp
	ProxyPass        /mcp/activity http://127.0.0.1:8822/mcp
	ProxyPassReverse /mcp/activity http://127.0.0.1:8822/mcp

	RewriteEngine On
	RewriteRule ^/mcp/(records|activity)(/|$) - [L]

	# The token API and the health check: only these answer under /api.
	RewriteRule ^/api/v1/(health|pay-runs)/?$ /api/v1/$1.php [L,QSA]
	RewriteRule ^/api/v1/(health|pay-runs)\.php$ - [L]
	RewriteRule ^/api/ - [R=404,L]

	# The sign-on receivers.
	RewriteRule ^/sso$ /sso.php [L,QSA]
	RewriteRule ^/sso/logout$ /sso/logout.php [L,QSA]

	# Canonical URLs (the action manifest): /x/new → form.php, /x/{id}/edit → form.php?id=, /x/{id} → view.php?id=.
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>

# PHP on the internal port, for the kernel's actions server and approval replays only.
Listen 127.0.0.1:8180
<VirtualHost 127.0.0.1:8180>
	DocumentRoot /srv/apps/hr/html
	ErrorLog ${APACHE_LOG_DIR}/hr-error.log
	CustomLog ${APACHE_LOG_DIR}/hr-access.log combined
	<Directory /srv/apps/hr/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>
	RewriteEngine On
	RewriteRule ^/api/v1/(health|pay-runs)/?$ /api/v1/$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>
